<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7F77DD" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="gw">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gg">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="#0d1117"/>

  <g stroke="#ffffff" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
  </g>

  <line x1="478" y1="172" x2="888" y2="172" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>

  <rect x="478" y="38" width="152" height="134" fill="#00F7FF" fill-opacity="0" rx="0">
    <animate attributeName="fill-opacity" values="0;0.03" dur="0.4s" begin="0.8s" fill="freeze"/>
  </rect>

  <rect x="630" y="38" width="258" height="134" fill="#7F77DD" fill-opacity="0" rx="0">
    <animate attributeName="fill-opacity" values="0;0.025" dur="0.4s" begin="1.0s" fill="freeze"/>
  </rect>

  <line x1="630" y1="38" x2="630" y2="172" stroke="#00F7FF" stroke-width="0.9" stroke-dasharray="4 3" opacity="0">
    <animate attributeName="opacity" from="0" to="0.55" dur="0.4s" begin="0.8s" fill="freeze"/>
  </line>

  <text x="554" y="33" font-family="'Courier New',monospace" font-size="9" fill="#00F7FF" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="1.0s" fill="freeze"/>
    ── explore (37%) ──
  </text>
  <text x="759" y="33" font-family="'Courier New',monospace" font-size="9" fill="#7F77DD" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="1.0s" fill="freeze"/>
    ── exploit ──
  </text>
  <text x="630" y="183" font-family="'Courier New',monospace" font-size="8" fill="#00F7FF" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="0.8s" fill="freeze"/>
    τ* = n/e
  </text>

  <!-- C1 x=500 y=148 low -->
  <circle cx="500" cy="148" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;148" dur="0.25s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="0.5s" fill="freeze"/>
  </circle>

  <!-- C2 x=522 y=90 mid -->
  <circle cx="522" cy="90" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;90" dur="0.25s" begin="1.1s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="1.1s" fill="freeze"/>
  </circle>

  <!-- C3 x=545 y=120 mid-low -->
  <circle cx="545" cy="120" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;120" dur="0.25s" begin="1.7s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="1.7s" fill="freeze"/>
  </circle>

  <!-- C4 x=568 y=60 HIGH — second best, gets gold star -->
  <circle cx="568" cy="60" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;60" dur="0.25s" begin="2.3s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="2.3s" fill="freeze"/>
  </circle>
  <text x="568" y="50" font-family="monospace" font-size="13" fill="#EF9F27" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.2s" begin="2.6s" fill="freeze"/>
    ★
  </text>
  <text x="585" y="58" font-family="'Courier New',monospace" font-size="7.5" fill="#EF9F27" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="0.2s" begin="2.6s" fill="freeze"/>
    best so far
  </text>

  <!-- C5 x=590 y=110 mid -->
  <circle cx="590" cy="110" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;110" dur="0.25s" begin="2.9s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="2.9s" fill="freeze"/>
  </circle>

  <!-- C6 x=610 y=135 low -->
  <circle cx="610" cy="135" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;135" dur="0.25s" begin="3.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="3.5s" fill="freeze"/>
  </circle>

  <!-- C7 x=625 y=95 mid — last in explore -->
  <circle cx="625" cy="95" r="4.5" fill="#4a4a5a" opacity="0">
    <animate attributeName="cy" values="20;95" dur="0.25s" begin="4.1s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.75" dur="0.25s" begin="4.1s" fill="freeze"/>
  </circle>

  <!-- E1 x=665 y=78 worse than C4 → reject -->
  <circle cx="665" cy="78" r="4.5" fill="#3a3a4a" opacity="0">
    <animate attributeName="cy" values="20;78" dur="0.25s" begin="5.0s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.5" dur="0.25s" begin="5.0s" fill="freeze"/>
  </circle>
  <text x="665" y="68" font-family="monospace" font-size="10" fill="#E24B4A" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="0.15s" begin="5.3s" fill="freeze"/>
    ✕
  </text>

  <!-- E2 x=715 y=112 worse → reject -->
  <circle cx="715" cy="112" r="4.5" fill="#3a3a4a" opacity="0">
    <animate attributeName="cy" values="20;112" dur="0.25s" begin="6.0s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.5" dur="0.25s" begin="6.0s" fill="freeze"/>
  </circle>
  <text x="715" y="102" font-family="monospace" font-size="10" fill="#E24B4A" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="0.15s" begin="6.3s" fill="freeze"/>
    ✕
  </text>

  <!-- E3 x=770 y=44 BEST overall → SELECTED -->
  <circle cx="770" cy="44" r="5.5" fill="#1D9E75" filter="url(#gg)" opacity="0">
    <animate attributeName="cy" values="20;44" dur="0.25s" begin="7.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.25s" begin="7.2s" fill="freeze"/>
    <animate attributeName="r" values="5.5;8;5.5" dur="0.6s" begin="7.5s" repeatCount="3"/>
  </circle>
  <text x="770" y="33" font-family="'Courier New',monospace" font-size="9" fill="#1D9E75" text-anchor="middle" opacity="0" filter="url(#gs)">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="7.5s" fill="freeze"/>
    SELECTED ✓
  </text>
  <line x1="770" y1="50" x2="770" y2="172" stroke="#1D9E75" stroke-width="0.6" stroke-dasharray="3 3" opacity="0">
    <animate attributeName="opacity" values="0;0.4" dur="0.2s" begin="7.5s" fill="freeze"/>
  </line>

  <!-- E4, E5 grayed unseen -->
  <circle cx="820" cy="88" r="4.5" fill="#2a2a38" opacity="0">
    <animate attributeName="opacity" values="0;0.3" dur="0.3s" begin="8.3s" fill="freeze"/>
  </circle>
  <circle cx="860" cy="65" r="4.5" fill="#2a2a38" opacity="0">
    <animate attributeName="opacity" values="0;0.3" dur="0.3s" begin="8.8s" fill="freeze"/>
  </circle>
  <text x="840" y="185" font-family="'Courier New',monospace" font-size="7.5" fill="#4a4a6a" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.3s" begin="8.8s" fill="freeze"/>
    (unseen)
  </text>

  <!-- LEFT: name -->
  <text x="55" y="88" font-family="'Courier New',monospace" font-size="50" font-weight="700" fill="url(#ng)" filter="url(#gw)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
    <animate attributeName="y" from="102" to="88" dur="0.7s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    Mayank
  </text>
  <text x="57" y="112" font-family="'Courier New',monospace" font-size="12" fill="#8b949e" letter-spacing="1.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    Mathematics · Probability · Optimization
  </text>
  <line x1="55" y1="128" x2="430" y2="128" stroke="url(#lg)" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
  </line>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <rect x="55" y="138" width="130" height="20" rx="10" fill="#00F7FF" fill-opacity="0.08" stroke="#00F7FF" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="120" y="152" font-family="'Courier New',monospace" font-size="9" fill="#00F7FF" text-anchor="middle">Quant Research</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.85s" fill="freeze"/>
    <rect x="195" y="138" width="145" height="20" rx="10" fill="#7F77DD" fill-opacity="0.08" stroke="#7F77DD" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="267" y="152" font-family="'Courier New',monospace" font-size="9" fill="#7F77DD" text-anchor="middle">Stochastic Systems</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
    <rect x="350" y="138" width="80" height="20" rx="10" fill="#D4537E" fill-opacity="0.08" stroke="#D4537E" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="390" y="152" font-family="'Courier New',monospace" font-size="9" fill="#D4537E" text-anchor="middle">AI Agents</text>
  </g>
  <text x="57" y="178" font-family="'Courier New',monospace" font-size="10" fill="#7F77DD" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.6s" begin="1.1s" fill="freeze"/>
    E[τ*] = n/e  ·  P(optimal) ≈ 0.368
  </text>

</svg>
