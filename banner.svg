<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00F7FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7F77DD" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#0d1117"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Faint background stochastic path (left) -->
  <polyline
    points="10,140 30,120 50,155 70,90 90,110 110,70 130,95 150,60 170,85 190,50 210,75 230,55 250,80 270,45 290,70"
    fill="none" stroke="#00F7FF" stroke-width="1" opacity="0.06" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gaussian bell curve — draws in -->
  <path id="gauss"
    d="M 620,160 C 640,158 660,140 680,100 C 700,60 710,40 720,38 C 730,40 740,60 760,100 C 780,140 800,158 820,160"
    fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round"
    stroke-dasharray="260" stroke-dashoffset="260" opacity="0.45">
    <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" from="0" to="0.45" dur="0.5s" begin="0.3s" fill="freeze"/>
  </path>

  <!-- Main stochastic path — draws in left to right -->
  <polyline id="mainpath"
    points="480,150 500,135 515,145 530,110 545,125 560,90 575,108 590,75 605,95 620,60 635,80 650,65 665,85 680,55 700,72 720,50 740,68 760,45 780,62 800,40 820,55 840,38 860,50 880,35 900,48"
    fill="none" stroke="#00F7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"
    stroke-dasharray="700" stroke-dashoffset="700" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.8s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="opacity" from="0" to="0.6" dur="0.3s" begin="0.6s" fill="freeze"/>
  </polyline>

  <!-- Dot 1 -->
  <circle cx="530" cy="110" r="2.5" fill="#00F7FF" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.3s" begin="1.0s" fill="freeze"/>
    <animate attributeName="r" values="0;4;2.5" dur="0.5s" begin="1.0s" fill="freeze"/>
  </circle>

  <!-- Dot 2 -->
  <circle cx="590" cy="75" r="2.5" fill="#00F7FF" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.3s" begin="1.15s" fill="freeze"/>
    <animate attributeName="r" values="0;4;2.5" dur="0.5s" begin="1.15s" fill="freeze"/>
  </circle>

  <!-- Dot 3 -->
  <circle cx="650" cy="65" r="2.5" fill="#7F77DD" opacity="0">
    <animate attributeName="opacity" from="0" to="0.9" dur="0.3s" begin="1.3s" fill="freeze"/>
    <animate attributeName="r" values="0;4;2.5" dur="0.5s" begin="1.3s" fill="freeze"/>
  </circle>

  <!-- Dot 4 -->
  <circle cx="720" cy="50" r="2.5" fill="#00F7FF" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.3s" begin="1.45s" fill="freeze"/>
    <animate attributeName="r" values="0;4;2.5" dur="0.5s" begin="1.45s" fill="freeze"/>
  </circle>

  <!-- Dot 5 (glowing tip) — pulses after appearing -->
  <circle cx="800" cy="40" r="3" fill="#7F77DD" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
    <animate attributeName="r" values="0;5;3" dur="0.5s" begin="1.6s" fill="freeze"/>
    <animate attributeName="r" values="3;4.5;3" dur="2s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Separator line -->
  <line x1="60" y1="145" x2="480" y2="145" stroke="url(#lineGrad)" stroke-width="0.75" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
  </line>

  <!-- Name — slides up and fades in -->
  <text x="60" y="96"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-size="52" font-weight="700"
    fill="url(#nameGrad)" filter="url(#glow)"
    opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="y" from="110" to="96" dur="0.7s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    Mayank
  </text>

  <!-- Subtitle — fades in -->
  <text x="62" y="120"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-size="13" font-weight="400" fill="#8b949e" letter-spacing="2"
    opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    Mathematics · Probability · Optimization · AI Systems
  </text>

  <!-- Pill 1 — Quant Research -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <rect x="62" y="155" width="130" height="22" rx="11" fill="#00F7FF" fill-opacity="0.1" stroke="#00F7FF" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="127" y="170"
      font-family="'JetBrains Mono', 'Courier New', monospace"
      font-size="10" font-weight="500" fill="#00F7FF" text-anchor="middle">Quant Research</text>
  </g>

  <!-- Pill 2 — Stochastic Systems -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze"/>
    <rect x="202" y="155" width="145" height="22" rx="11" fill="#7F77DD" fill-opacity="0.1" stroke="#7F77DD" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="274" y="170"
      font-family="'JetBrains Mono', 'Courier New', monospace"
      font-size="10" font-weight="500" fill="#7F77DD" text-anchor="middle">Stochastic Systems</text>
  </g>

  <!-- Pill 3 — AI Agents -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <rect x="357" y="155" width="90" height="22" rx="11" fill="#D4537E" fill-opacity="0.1" stroke="#D4537E" stroke-width="0.75" stroke-opacity="0.5"/>
    <text x="402" y="170"
      font-family="'JetBrains Mono', 'Courier New', monospace"
      font-size="10" font-weight="500" fill="#D4537E" text-anchor="middle">AI Agents</text>
  </g>

  <!-- Formula — fades in last -->
  <text x="830" y="185"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-size="11" fill="#7F77DD" text-anchor="middle"
    opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.8s" begin="1.8s" fill="freeze"/>
    E[τ*] = n/e
  </text>

</svg>
